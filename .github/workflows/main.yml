name: CI/CD Pipeline Backend a AWS EC2 via ECR

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    name: Build y Push de la Imagen a ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1 

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
 
      - name: Build, tag, y push de la imagen Docker a ECR
        working-directory: ./back-Ventas_SpringBoot/Springboot-API-REST
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: backendventasinnovatech 
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy-to-ec2:
    name: Despliegue en EC2 (Backend Privado con Compose)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar despliegue automático vía Bastion/Frontend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BACKEND_PRIVATE_IP }} 
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          proxy_host: ${{ secrets.FRONTEND_PUBLIC_IP }} 
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            # 1. Instalar Docker y Docker Compose
            sudo yum update -y
            sudo yum install docker -y
            sudo service docker start
            sudo usermod -aG docker ec2-user
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            
            # 2. Autenticar en ECR
            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
            
            # 3. Crear el archivo docker-compose.yml de PRODUCCIÓN directamente en la EC2
            cat <<EOF > docker-compose.yml
            version: '3.8'
            
            services:
              db:
                image: mysql:8.0
                container_name: db-ventas
                restart: always
                environment:
                  MYSQL_ROOT_PASSWORD: admin123        
                  MYSQL_DATABASE: db_ventas                
                  MYSQL_USER: user_ventas
                  MYSQL_PASSWORD: password_ventas
                ports:
                  - "3306:3306"
                networks:
                  - backend_network
                volumes:
                  - db_data:/var/lib/mysql
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                  interval: 10s
                  timeout: 20s
                  retries: 10
            
              backend:
                image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/backendventasinnovatech:latest
                container_name: app-backend
                restart: always
                ports:
                  - "8080:8080"
                environment:
                  - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/db_ventas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
                  - SPRING_DATASOURCE_USERNAME=user_ventas
                  - SPRING_DATASOURCE_PASSWORD=password_ventas
                  - SPRING_JPA_HIBERNATE_DDL_AUTO=update
                networks:
                  - backend_network
                depends_on:
                  db:
                    condition: service_healthy
            
            networks:
              backend_network:
                driver: bridge
            
            volumes:
              db_data:
            EOF
            
            # 4. Apagar entorno anterior, limpiar basuras y levantar todo
            sudo docker-compose down || true
            sudo docker rm -f app-backend || true
            sudo docker rm -f db-ventas || true
            sudo docker-compose pull backend
            sudo docker-compose up -d